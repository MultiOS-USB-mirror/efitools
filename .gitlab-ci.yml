image: ubuntu:22.04

build:
  stage: build
  before_script:
    - echo "Europe/Berlin" > /etc/timezone
    - export DEBIAN_FRONTEND=noninteractive
    - sed -i '/deb-src/s/^# //' /etc/apt/sources.list
    - apt update
    - apt upgrade -y
    - apt install -y sudo
    - apt build-dep -y efitools
    - adduser --disabled-password --gecos "" user
  script:
    - chown -R user .
    - sudo -u user make
  artifacts:
    paths:
      - KeyTool.efi
  when: manual
